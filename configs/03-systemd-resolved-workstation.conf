# ==============================================================================
# File: 03-systemd-resolved-workstation.conf
# Path: /etc/systemd/resolved.conf.d/10-quad9-dot.conf
# Role: Roaming Linux Workstation Strict DoT Policy (Pop!_OS / Ubuntu / Debian)
# Reload Command: sudo systemctl restart systemd-resolved && resolvectl status
# ==============================================================================

[Resolve]
# Primary & Secondary Quad9 Threat-Blocking Resolvers (IPv4 + IPv6) with SNI
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net

# Clear compiled-in fallback resolvers to prevent silent plaintext downgrade
FallbackDNS=

# Fail-closed TLS enforcement (rejects invalid/self-signed captive portal certs)
DNSOverTLS=yes

# Enforce DNSSEC validation at stub resolver
DNSSEC=yes

# Route all global domain lookups through encrypted Quad9 upstream
Domains=~.

# Maintain local stub cache on 127.0.0.53
Cache=yes
DNSStubListener=yes
