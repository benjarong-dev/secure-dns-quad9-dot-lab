# ==============================================================================
# File: 02-unbound-quad9-dot.conf
# Path: /etc/unbound/unbound.conf.d/quad9-dot.conf
# Role: Local DNSSEC-Validating Cache & Strict DNS-over-TLS Forwarder
# ==============================================================================

server:
    verbosity: 1
    num-threads: 2

    # Bind to loopback and internal 802.1Q VLAN gateway interfaces
    interface: 127.0.0.1
    interface: 192.168.20.1
    interface: 192.168.40.1
    port: 53

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Strict subnet ACLs (RFC 1918 VLANs only; refuse open recursion)
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.20.0/24 allow
    access-control: 192.168.40.0/24 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    # System CA bundle for X.509 certificate verification (Debian/Ubuntu/Pop!_OS)
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    # Cryptographic DNSSEC Root Trust Anchor
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes

    # Security & RFC 9156 Privacy Hardening
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    use-caps-for-id: yes
    qname-minimisation: yes

    # Performance & Cache Resilience
    msg-cache-size: 64m
    rrset-cache-size: 128m
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    minimal-responses: yes

forward-zone:
    name: "."
    forward-tls-upstream: yes

    # Quad9 Malware-Blocking + DNSSEC Anycast Resolvers (Strict SNI Verification)
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 2620:fe::fe@853#dns.quad9.net
    forward-addr: 2620:fe::9@853#dns.quad9.net
